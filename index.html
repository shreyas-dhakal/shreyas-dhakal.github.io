<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Doclify coming soon.">
    <title>Doclify coming soon</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f5f2;
        color: #252525;
        font-family: system-ui, sans-serif;
      }

      h1 {
        position: relative;
        width: 12ch;
        height: 12ch;
        margin: 0;
        font-size: clamp(1rem, 4vw, 1.75rem);
        font-weight: 600;
        text-transform: uppercase;
        animation: spin 10s linear infinite;
      }

      h1 span {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(calc(360deg / var(--total) * var(--index))) translateY(-5ch);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      @keyframes spin { to { rotate: 360deg; } }
      @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
    </style>
  </head>
  <body>
    <h1><span class="sr-only">Doclify coming soon</span></h1>
    <script>
      const h1 = document.querySelector("h1");
      const letters = [..."Doclify • coming soon • "];
      h1.style.setProperty("--total", letters.length);
      letters.forEach((letter, i) => {
        const span = document.createElement("span");
        span.ariaHidden = "true";
        span.textContent = letter;
        span.style.setProperty("--index", i);
        h1.append(span);
      });
    </script>
  </body>
</html>
